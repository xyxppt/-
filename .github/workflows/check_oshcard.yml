name: Check OSH Card

on:
  workflow_dispatch:

jobs:
  check-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授權機器人自動寫入與儲存記憶檔

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run course checker
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # 想要在 Discord 看到真實推播課程的完整原始資料時，把這裡改成 "1"
          DEBUG_MODE: "1"
          # 可用逗號分隔調整要排除的離島關鍵字，不需要改程式碼
          EXCLUDED_LOCATIONS: "澎湖,連江,馬祖,金門"
        run: python check_oshcard.py

      - name: Save memory state (Auto Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_courses.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto update seen courses memory"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to commit."
          fi
