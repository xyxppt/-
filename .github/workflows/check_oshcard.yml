name: Check OSH Card

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  check-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授權 Actions 寫入 Git 記憶檔

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run course checker
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python check_oshcard.py

      - name: Save memory state (Auto Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_courses.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update seen courses memory" && git push)
